# prod-окружение
namespace: my-notes-prod

backend:
  replicas: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    ENVIRONMENT: production
    LOG_LEVEL: INFO
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"

frontend:
  replicas: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  service:
    type: LoadBalancer

postgres:
  storage: 10Gi

secrets:
  SECRET_KEY: "prod-secret-key-change-me"
