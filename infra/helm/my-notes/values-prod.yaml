namespace: my-notes-prod

backend:
  replicas: 3
  env:
    ENVIRONMENT: "production"
    SECRET_KEY: "dev-secret-key"
    LOG_LEVEL: "INFO"
    ACCESS_TOKEN_EXPIRE_MINUTES: "60"

frontend:
  replicas: 2
  service:
    type: LoadBalancer

postgres:
  storage: 10Gi

imagePullSecrets:
  - name: ghcr-auth

ingress:
  enabled: true
  className: traefik
  host: prod.my-notes.lan # замени на свой реальный домен
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure # используем порт 443
    cert-manager.io/cluster-issuer: "selfsigned" # или "letsencrypt-prod"
  tls:
    enabled: true
    secretName: prod-tls
